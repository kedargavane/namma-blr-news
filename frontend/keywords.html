<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namma BLR — Keywords</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-light:#E1F5EE;--green-mid:#5DCAA5;--green-dark:#085041;
  --blue-light:#E6F1FB;--blue-dark:#0C447C;
  --amber-light:#FAEEDA;--amber:#854F0B;
  --pink-light:#FBEAF0;--pink:#993556;
  --purple-light:#EEEDFE;--purple:#534AB7;
  --red:#E24B4A;--red-light:#FCEBEB;
  --bg:#F7F6F2;--bg2:#FFFFFF;--bg3:#EFEDE8;
  --text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;
  --border:#e8e6e0;--border2:#d4d2cc;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --radius:10px;--radius-sm:6px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:12px;height:52px}
.logo{font-family:var(--serif);font-size:17px}
.logo span{font-style:italic;color:var(--green)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-link{padding:6px 12px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text2);cursor:pointer;text-decoration:none;transition:all .12s;border:none;background:transparent;font-family:var(--sans)}
.nav-link:hover{background:var(--bg3);color:var(--text)}
.nav-link.active{background:var(--green-light);color:var(--green-dark);font-weight:500}
.container{max-width:860px;margin:0 auto;padding:28px 20px}
.page-title{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.page-sub{font-size:12.5px;color:var(--text3);margin-bottom:24px;line-height:1.6}
.add-row{display:flex;gap:8px;margin-bottom:24px;background:var(--bg2);padding:14px;border-radius:var(--radius);border:1px solid var(--border)}
.add-row input{flex:1;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--sans);outline:none}
.add-row input:focus{border-color:var(--green)}
.add-row select{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;font-family:var(--sans);cursor:pointer}
.add-btn{padding:8px 16px;border-radius:var(--radius-sm);background:var(--green);border:none;color:#fff;font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer;white-space:nowrap}
.add-btn:hover{opacity:.88}
.add-btn:disabled{opacity:.5;cursor:default}
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:11px;color:var(--text3)}
.stat-card strong{display:block;font-size:18px;font-weight:500;color:var(--text);margin-bottom:2px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.section-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.filter-btns{display:flex;gap:4px;margin-left:auto}
.filter-btn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;font-family:var(--sans);cursor:pointer;transition:all .12s}
.filter-btn.on{background:var(--green-light);border-color:var(--green-mid);color:var(--green-dark)}
.search-input{flex:1;max-width:220px;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:12px;font-family:var(--sans);outline:none}
.search-input:focus{border-color:var(--green)}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:24px}
.kw-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:8px;transition:border-color .12s}
.kw-card:hover{border-color:var(--border2)}
.kw-card.disabled{opacity:.4}
.kw-mine{border-left:3px solid var(--green)}
.kw-word{flex:1;font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw-badge{font-size:9px;font-weight:500;padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.badge-env{background:var(--green-light);color:var(--green-dark)}
.badge-legal{background:var(--blue-light);color:var(--blue-dark)}
.badge-govt{background:var(--amber-light);color:var(--amber)}
.badge-infra{background:var(--pink-light);color:var(--pink)}
.badge-civic{background:var(--purple-light);color:var(--purple)}
.badge-all{background:var(--bg3);color:var(--text2)}
.kw-hits{font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.kw-toggle{width:28px;height:16px;border-radius:8px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.kw-toggle.on{background:var(--green)}
.kw-toggle.off{background:var(--border2)}
.kw-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.kw-toggle.on::after{transform:translateX(12px)}
.kw-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.kw-del:hover{background:var(--red-light);color:var(--red)}
.my-section{margin-bottom:24px}
.my-section-head{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
.auth-prompt{background:var(--amber-light);border:1px solid #FAC775;border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;font-size:12.5px;color:var(--amber);display:none}
.auth-prompt a{color:var(--amber);font-weight:500}
</style>
</head>
<body>
<nav class="topnav">
  <div class="logo">Namma <span>BLR</span></div>
  <div class="nav-links">
    <a class="nav-link" href="/">News Feed</a>
    <a class="nav-link active" href="/keywords.html">Keywords</a>
    <button class="nav-link" id="logout-btn" onclick="logout()" style="display:none">Sign out</button>
    <a class="nav-link" href="/login.html" id="login-link">Sign in</a>
  </div>
</nav>

<div class="container">
  <div class="page-title">Keyword Manager</div>
  <div class="page-sub">Keywords control what articles get scraped every 2 hours. Add trending topics, locality names, or agency names to expand coverage. All keywords go into a shared pool.</div>

  <div class="auth-prompt" id="auth-prompt">
    You need to <a href="/login.html">sign in</a> to add or manage keywords.
  </div>

  <div class="add-row" id="add-row">
    <input type="text" id="new-keyword" placeholder="Add keyword — e.g. 'Sarjapur Road' or 'tree felling'" onkeydown="if(event.key==='Enter')addKeyword()">
    <select id="new-category">
      <option value="">All categories</option>
      <option value="env">Environment</option>
      <option value="legal">Legal</option>
      <option value="govt">Govt</option>
      <option value="infra">Infrastructure</option>
      <option value="civic">Civic</option>
    </select>
    <button class="add-btn" id="add-btn" onclick="addKeyword()">+ Add</button>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <!-- My keywords (only when logged in) -->
  <div class="my-section" id="my-section" style="display:none">
    <div class="my-section-head">
      <span style="color:var(--green)">●</span> My keywords
      <span style="font-size:11px;color:var(--text3)" id="my-count"></span>
    </div>
    <div class="kw-grid" id="my-kw-grid"></div>
  </div>

  <!-- All keywords -->
  <div class="section-head">
    <span class="section-title" id="kw-section-title">All keywords</span>
    <input class="search-input" type="text" placeholder="Filter…" oninput="renderKeywords()">
    <div class="filter-btns">
      <button class="filter-btn on" data-f="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" data-f="env" onclick="setFilter('env',this)">Env</button>
      <button class="filter-btn" data-f="legal" onclick="setFilter('legal',this)">Legal</button>
      <button class="filter-btn" data-f="govt" onclick="setFilter('govt',this)">Govt</button>
      <button class="filter-btn" data-f="infra" onclick="setFilter('infra',this)">Infra</button>
      <button class="filter-btn" data-f="civic" onclick="setFilter('civic',this)">Civic</button>
      <button class="filter-btn" data-f="custom" onclick="setFilter('custom',this)">Custom</button>
    </div>
  </div>
  <div class="kw-grid" id="kw-grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API      = window.location.origin;
const token    = localStorage.getItem("blr_token");
const userId   = (() => { try { return JSON.parse(localStorage.getItem("blr_user") || "{}").id; } catch(e) { return null; } })();

const CAT_LABEL = {env:"Env",legal:"Legal",govt:"Govt",infra:"Infra",civic:"Civic","":"All"};
const CAT_CLASS = {env:"badge-env",legal:"badge-legal",govt:"badge-govt",infra:"badge-infra",civic:"badge-civic","":"badge-all"};

let keywords      = [];
let activeFilter  = "all";

function authHeaders() {
  return token
    ? {"Content-Type":"application/json","Authorization":`Bearer ${token}`}
    : {"Content-Type":"application/json"};
}

// Init auth UI
if (token) {
  document.getElementById("logout-btn").style.display = "inline-block";
  document.getElementById("login-link").style.display = "none";
} else {
  document.getElementById("add-row").style.opacity = "0.5";
  document.getElementById("add-row").style.pointerEvents = "none";
  document.getElementById("auth-prompt").style.display = "block";
}

function logout() { localStorage.clear(); window.location.href = "/login.html"; }

async function loadKeywords() {
  try {
    const res  = await fetch(`${API}/api/keywords`, {headers: authHeaders()});
    if (!res.ok) { if (res.status===401) { window.location.href="/login.html"; return; } throw new Error(); }
    const data = await res.json();
    keywords   = data.keywords || [];
    renderStats();
    renderMyKeywords();
    renderKeywords();
  } catch(e) {
    document.getElementById("kw-grid").innerHTML = `<div class="empty">Sign in to manage keywords</div>`;
  }
}

function renderStats() {
  const total   = keywords.length;
  const enabled = keywords.filter(k=>k.enabled).length;
  const custom  = keywords.filter(k=>!k.is_default).length;
  const hits    = keywords.reduce((a,b)=>a+(b.hit_count||0),0);
  document.getElementById("stats-row").innerHTML = `
    <div class="stat-card"><strong>${total}</strong>Total keywords</div>
    <div class="stat-card"><strong>${enabled}</strong>Active</div>
    <div class="stat-card"><strong>${custom}</strong>Custom added</div>
    <div class="stat-card"><strong>${hits}</strong>Article matches</div>`;
}

function renderMyKeywords() {
  if (!userId) return;
  const mine = keywords.filter(k => k.created_by === userId);
  const sec  = document.getElementById("my-section");
  const grid = document.getElementById("my-kw-grid");
  const cnt  = document.getElementById("my-count");
  if (mine.length === 0) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  cnt.textContent = `${mine.length} keyword${mine.length!==1?"s":""}`;
  grid.innerHTML = mine.map(k => makeCard(k, true)).join("");
}

function renderKeywords() {
  const q  = document.querySelector(".search-input").value.toLowerCase();
  let list = keywords.filter(k => {
    if (q && !k.word.includes(q)) return false;
    if (activeFilter === "all") return true;
    if (activeFilter === "custom") return !k.is_default;
    return k.category === activeFilter;
  });
  document.getElementById("kw-section-title").textContent = `${list.length} keyword${list.length!==1?"s":""}`;
  if (!list.length) { document.getElementById("kw-grid").innerHTML = `<div class="empty">No keywords match</div>`; return; }
  document.getElementById("kw-grid").innerHTML = list.map(k => makeCard(k, false)).join("");
}

function makeCard(k, isMine) {
  return `<div class="kw-card${k.enabled?"":" disabled"}${isMine?" kw-mine":""}" id="kwc-${k.id}">
    <div>
      <div class="kw-word" title="${esc(k.word)}">${esc(k.word)}</div>
      <div style="display:flex;gap:4px;margin-top:2px">
        <span class="kw-badge ${CAT_CLASS[k.category]||'badge-all'}">${CAT_LABEL[k.category]||"All"}</span>
        ${k.hit_count>0?`<span class="kw-hits">${k.hit_count} hits</span>`:""}
      </div>
    </div>
    ${token?`
    <button class="kw-toggle ${k.enabled?"on":"off"}" onclick="toggleKw(${k.id},${!k.enabled})" title="${k.enabled?"Disable":"Enable"}"></button>
    <button class="kw-del" onclick="deleteKw(${k.id})" title="Remove">×</button>`:""}
  </div>`;
}

async function addKeyword() {
  if (!token) { window.location.href = "/login.html"; return; }
  const input = document.getElementById("new-keyword");
  const word  = input.value.trim().toLowerCase();
  if (!word) return;
  const btn = document.getElementById("add-btn");
  btn.disabled = true; btn.textContent = "Adding…";
  try {
    const res  = await fetch(`${API}/api/keywords`, {
      method: "POST", headers: authHeaders(),
      body: JSON.stringify({word, category: document.getElementById("new-category").value})
    });
    if (!res.ok) { const d=await res.json(); throw new Error(d.detail||"Error"); }
    input.value = "";
    showToast(`"${word}" added`);
    await loadKeywords();
  } catch(e) { showToast("Error: "+e.message); }
  finally { btn.disabled=false; btn.textContent="+ Add"; }
}

async function toggleKw(id, enabled) {
  try {
    await fetch(`${API}/api/keywords/${id}`, {
      method:"PATCH", headers: authHeaders(),
      body: JSON.stringify({enabled})
    });
    const kw = keywords.find(k=>k.id===id);
    if (kw) { kw.enabled=enabled; renderStats(); renderMyKeywords(); renderKeywords(); }
    showToast(enabled?"Enabled":"Disabled");
  } catch(e) { showToast("Error: "+e.message); }
}

async function deleteKw(id) {
  const kw = keywords.find(k=>k.id===id);
  if (!kw || !confirm(`Remove "${kw.word}"?`)) return;
  try {
    await fetch(`${API}/api/keywords/${id}`, {method:"DELETE", headers: authHeaders()});
    keywords = keywords.filter(k=>k.id!==id);
    renderStats(); renderMyKeywords(); renderKeywords();
    showToast(`"${kw.word}" removed`);
  } catch(e) { showToast("Error: "+e.message); }
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("on",b===btn));
  renderKeywords();
}

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function showToast(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

if (token) loadKeywords();
else document.getElementById("kw-grid").innerHTML = `<div class="empty"><a href="/login.html" style="color:var(--green)">Sign in</a> to view and manage keywords</div>`;
</script>
</body>
</html>
