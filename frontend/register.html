<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namma BLR — Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;
  --bg:#F7F6F2;--bg2:#FFFFFF;--bg3:#EFEDE8;
  --text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;
  --border:#e8e6e0;--border2:#d4d2cc;--red:#E24B4A;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --radius:12px;--radius-sm:7px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:4px}
.logo span{font-style:italic;color:var(--green)}
.tagline{font-size:12px;color:var(--text3);margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border .15s}
input:focus{border-color:var(--green)}
.invite-note{font-size:11px;color:var(--text3);margin-top:4px}
.btn{width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--green);border:none;color:#fff;font-size:13.5px;font-family:var(--sans);font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:4px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:default}
.error{font-size:12px;color:var(--red);margin-top:10px;text-align:center;display:none}
.footer-links{text-align:center;margin-top:20px;font-size:12px;color:var(--text3)}
.footer-links a{color:var(--green);text-decoration:none;font-weight:500}
.footer-links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Namma <span>BLR</span></div>
  <div class="tagline">Create your account</div>

  <div class="form-group">
    <label>Full name</label>
    <input type="text" id="name" placeholder="Your name" autocomplete="name">
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label>Invite code</label>
    <input type="text" id="invite_code" placeholder="Enter your invite code" onkeydown="if(event.key==='Enter')doRegister()">
    <div class="invite-note">Contact the admin to get an invite code</div>
  </div>

  <button class="btn" id="reg-btn" onclick="doRegister()">Create account</button>
  <div class="error" id="error"></div>

  <div class="footer-links">
    Already have an account? <a href="/login.html">Sign in</a>
  </div>
</div>

<script>
const API = window.location.origin;

if (localStorage.getItem("blr_token")) window.location.href = "/";

async function doRegister() {
  const name        = document.getElementById("name").value.trim();
  const email       = document.getElementById("email").value.trim();
  const password    = document.getElementById("password").value.trim();
  const invite_code = document.getElementById("invite_code").value.trim();
  const btn         = document.getElementById("reg-btn");

  document.getElementById("error").style.display = "none";
  if (!name || !email || !password || !invite_code) {
    showErr("All fields are required"); return;
  }
  if (password.length < 6) { showErr("Password must be at least 6 characters"); return; }

  btn.disabled = true; btn.textContent = "Creating account…";
  try {
    const res  = await fetch(`${API}/api/auth/register`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({name, email, password, invite_code})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Registration failed");

    localStorage.setItem("blr_token", data.token);
    localStorage.setItem("blr_user",  JSON.stringify(data.user));
    localStorage.setItem("blr_role",  data.user.role);
    localStorage.setItem("blr_name",  data.user.name);
    window.location.href = "/";
  } catch(e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = "Create account";
  }
}

function showErr(msg) {
  const el = document.getElementById("error");
  el.textContent = msg; el.style.display = "block";
}
</script>
</body>
</html>
